<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cybersecurity Links</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0d8;
      --accent: #1a5c38;
      --accent-light: #e8f5ee;
      --text: #1c1c1c;
      --muted: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 4rem 2rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.5rem;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    a.link-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    a.link-row:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }

    .link-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .link-arrow {
      color: var(--muted);
      font-size: 1rem;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Cybersecurity Links</h1>
    <p class="subtitle">Google Cybersecurity Certificate · martyv4</p>

    <div class="links-list">

      <!-- Copy and paste a link-row below to add more links -->
      <!-- Replace href="#" with your URL and update the name -->

      <a class="link-row" href="#" target="_blank">
        <span class="link-name">Link name here</span>
        <span class="link-arrow">→</span>
      </a>

      <!-- Wireshark Link -->
      <a class="link-row" href="https://www.wireshark.org/" target="_blank">
        <span class="link-name">Wireshark</span>
        <span class="link-arrow">→</span>
      </a>

      <!-- Cybersecurity Resource Links -->
      <a class="link-row" href="https://www.kali.org/" target="_blank">
        <span class="link-name">Kali Linux</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://www.cyberseek.org/" target="_blank">
        <span class="link-name">CyberSeek</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://www.cisa.gov/" target="_blank">
        <span class="link-name">CISA (Cybersecurity & Infrastructure Security Agency)</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://www.owasp.org/" target="_blank">
        <span class="link-name">OWASP Foundation</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-row" href="https://www.sans.org/" target="_blank">
        <span class="link-name">SANS Institute</span>
        <span class="link-arrow">→</span>
      </a>

    </div>

    <footer>github.com/martyv4</footer>

  </div>
</body>
</html>
